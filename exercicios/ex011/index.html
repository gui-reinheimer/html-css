<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mídias em HTML5</title>
  </head>
  <body>
    <h1>Imagens Dinâmicas</h1>
    <p>
      Tente abrir em varios dispositivos diferentes ou simplesmente diminua o
      tamnho do seu navegador
    </p>

    <picture>
      <source
        media="(max-width: 750px)"
        srcset="imagens/foto-p.png"
        type="image/png"
      />
      <source
        media="(max-width: 1050px)"
        srcset="imagens/foto-m.png"
        type="image/png"
      />
      <img src="imagens/foto-g.png" alt="imagem flexivel" />
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Podemos reproduzir audios utilizando html5</p>
    <audio src="midia/mission-to-mars.mp3" controls></audio>
    <audio preload="metadata" controls>
      <source src="midia/guanacast-33.mp3" type="audio/mpeg" />
    </audio>
  </body>
</html>
