<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Mis inputs</h1>

    <form action="cadastro.js">
        <p>
            <label for="icor">Cor:</label>
            <input type="color" name="icor" id="icor" value="#00ff00">
        </p>

        <p>
            <label for="iniv">Nivel de satisfação:</label>
            <input type="range" name="iniv" id="iniv" min="1" max="5" value="1">
        </p>

        <label for="ifoto">Foto do perfil:</label>
        <input type="file" name="ifoto" id="ifoto">
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
