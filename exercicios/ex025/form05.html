<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h1>Checkboxs e radio</h1>

    <form action="" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="ismas">
            <label for="ismas">Masculino</label>
            <input type="radio" name="sexo" id="isfem">
            <label for="isfem">Feminino</label>
        </fieldset>
     
        <fieldset>
        <legend>Esportes favoritos</legend>
        <label for="esbas"
          ><input type="checkbox" name="esbas" id="esbas" /> Basquete <br
        /></label>
        <label for="esfut"
          ><input type="checkbox" name="esfut" id="esfut" checked/> Futebol <br
        /></label>
        <label for="esvolei"
          ><input type="checkbox" name="esvolei" id="esvolei" /> Volei <br
        /></label>
        <label for="estenis"
          ><input type="checkbox" name="estenis" id="estenis" /> Tenis <br
        /></label>
      </fieldset>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
