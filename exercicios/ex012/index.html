<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videos</title>
  </head>
  <body>
    <h1>Videos hospedados localmente</h1>
    <p>Esse video esta hospedado no meu proprio servidor</p>

    <video width="560" poster="imagens/limoes.jpg" controls autoplay loop>
      <source src="media/Meu-Video-mp4.mp4" type="video/mp4" />
      <source src="media/Meu-Video-webm.webm" type="video/webm" />
      <source src="media/Meu-Video-mkv.mkv" type="video/x-matroska" />
      <p>Esse video não e compativel com seu navegador</p>
    </video>

    <h1>Videos Externos</h1>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/OzUnqQk4eOg?si=2fqx7Q5UFuYU6wET"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
