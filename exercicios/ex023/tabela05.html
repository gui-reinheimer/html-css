<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        width: 500px;
        border-collapse: collapse;
    }
    
    td,
    th {
        border: 1px solid black;
        padding: 5px;
        text-align: center;
      }

      th {
        background-color: rgb(105, 105, 105);
        color: white;
      }

      .areas {
        background-color: #f2f2f2;
        color: black;
      }

      .medias {
        text-align: left;
      }

      .disciplinas {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h1>Tabela de notas</h1>

    <table>
      <thead>
        <tr>
          <th rowspan="2" scope="col">Área</th>
          <th rowspan="2" scope="col">Disciplinas</th>
          <th colspan="2" scope="colgroup">Notas</th>
          <th rowspan="2" scope="col">Média</th>
        </tr>
        <tr>
          <th scope="col">Nota 1</th>
          <th scope="col">Nota 2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th rowspan="4" class="areas" scope="rowgroup">Exatas</th>
          <td class="disciplinas">Matemática</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="disciplinas">Fisica</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="disciplinas">Química</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="disciplinas">Biologia</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <th colspan="4" class="medias" scope="row">Média de Exatas</th>
          <th>0.0</th>
        </tr>

        <tr>
          <th rowspan="2" class="areas" scope="rowgroup">Humanas</th>
          <td class="disciplinas">História</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="disciplinas">Geografia</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <th colspan="4" class="medias" scope="row">Media de Humanas</th>
          <th>0.0</th>
        </tr>
      </tbody>
    </table>
  </body>
</html>
