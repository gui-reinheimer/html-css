<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradiente em CSS</title>
    <style>
      * {
        /*configuraçoes globais nas CSS */
        height: 100%;
      }

      body {
        background-image: linear-gradient(
          45deg,
          #d03e89,
          #7b35ba,
          #bc3b95,
          #eb4d70,
          #fbc23d
        );
      }
    </style>
  </head>
  <body>
    <h1>Testando Gradiente</h1>
  </body>
</html>
