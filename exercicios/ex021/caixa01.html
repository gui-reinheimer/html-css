<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelo de caixas</title>
    <style>
      h1 { /* Box-level */
        background-color: gray;
        height: 200px;
        width: 300px;
        border: 10px solid #8d0000;
        margin: 20px auto 30px auto;
        padding: 10px 10px 10px 15px;
        outline: 5px dashed rgb(28, 190, 13);
      }

      a { /*Inline-level*/
        border: 10px groove greenyellow;
        padding: 5px 10px;
      }
    </style>
  </head>
  <body>
    <h1>Exemplo de caixa box-level</h1>

    <p>
      Paragrafos tambem são exemplos de box-level, mas os
      <a href="#">links são exemplos de inline-level</a> vamos ver como funciona
    </p>
  </body>
</html>
