<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position</title>

    <style>
      #container {
        height: 96vh;
        position: relative;
        background-color: blueviolet;
        background-image: url(img/target001.png);
        background-size: 100% 100%;
      }

      #conteudo {
        width: 200px;
        height: 200px;
        background: yellow url(img/target001.png);
        background-size: 100% 100%;

        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #conteudo2 {
        position: absolute;
        width: 200px;
        height: 200px;
        background: red;
        bottom: 0px;
      }

      #conteudo3 {
        width: 200px;
        height: 200px;
        background-color: aqua;
      }

      #conteudo4 {
        width: 200px;
        height: 200px;
        background-color: green;
        position: absolute;
        right: 0px;
        top: 0px;
      }
      #conteudo5 {
        width: 200px;
        height: 200px;
        background-color: #007c80;
        position: absolute;
        right: 0px;
        bottom: 0px;
      }
    </style>
  </head>
  <body>
    <section id="container">
      <article id="conteudo"></article>
      <article id="conteudo2"></article>
      <article id="conteudo3"></article>
      <article id="conteudo4"></article>
      <article id="conteudo5"></article>
    </section>
  </body>
</html>
