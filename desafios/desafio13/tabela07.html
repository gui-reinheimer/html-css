<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio 13</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        width: 400px;
        border-collapse: collapse;
      }

      td,
      th {
        border: 1px solid black;
        padding: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Desafio 13 - Tabelas</h1>

    <table>
      <tr>
        <td colspan="4">A</td>
        <td>B</td>
      </tr>
      <tr>
        <td rowspan="2">C</td>
        <td colspan="2">D</td>
        <td>E</td>
        <td rowspan="2">F</td>
      </tr>
      <tr>
        <td>G</td>
        <td>H</td>
        <td>I</td>
      </tr>
      <tr>
        <td colspan="4">J</td>
        <td>K</td>
      </tr>
    </table>
  </body>
</html>
